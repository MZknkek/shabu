<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | Premium Suki</title>

    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <img
                    src="http://localhost:3000/images/logo.png"
                    class="logo"
                    alt="โลโก้ร้าน"
                >

            <h1>Premium Suki</h1>

            <p class="subtitle">
                ระบบจัดการร้าน Premium Suki
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        ชื่อผู้ใช้
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="กรอกชื่อผู้ใช้"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        รหัสผ่าน
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="กรอกรหัสผ่าน"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>

                <button
                    type="submit"
                    class="login-button"
                >
                    เข้าสู่ระบบ
                </button>

            </form>

        </section>

    </main>

    <script src="app.js?v=1"></script>

</body>
</html>
